services:
  postgres:
    image: postgres:18.6-alpine3.23
    container_name: familietools-postgres-dev

    environment:
      POSTGRES_DB: familietools
      POSTGRES_USER: familietools
      POSTGRES_PASSWORD: familietools_dev

    ports:
      - '5432:5432'

    volumes:
      - familietools-postgres-dev:/var/lib/postgresql

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U familietools -d familietools']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

volumes:
  familietools-postgres-dev:
